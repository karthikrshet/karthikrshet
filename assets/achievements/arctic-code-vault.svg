<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="bg-arctic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Shield Frame -->
  <path d="M48,6 L82,18 V46 C82,68 66,84 48,90 C30,84 14,68 14,46 V18 Z" fill="url(#bg-arctic)" stroke="#FFFFFF" stroke-width="3" filter="url(#shadow)"/>
  <!-- Aurora Sky -->
  <path d="M16,24 Q48,10 80,24 Q60,34 16,24 Z" fill="url(#aurora)" opacity="0.8"/>
  <!-- Full Moon -->
  <circle cx="34" cy="28" r="7" fill="#FEF08A"/>
  <!-- Snowy Mountain Peak -->
  <path d="M48,36 L72,74 H24 Z" fill="#1E293B"/>
  <path d="M48,36 L56,48 L48,46 L40,48 Z" fill="#F8FAFC"/>
</svg>